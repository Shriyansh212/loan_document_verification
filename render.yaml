services:
  - type: web
    name: loan-document-verification
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: info
      - key: GROQ_API_KEY
        sync: false
